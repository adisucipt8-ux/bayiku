name: Rakit APK Bayiku

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rakit APK
        # Coba ulang otomatis bila server Maven sedang sibuk (error 429)
        run: gradle assembleRelease --no-daemon || (sleep 60 && gradle assembleRelease --no-daemon) || (sleep 120 && gradle assembleRelease --no-daemon)

      - name: Ganti nama file
        run: cp app/build/outputs/apk/release/app-release.apk Bayiku.apk

      - name: Terbitkan di halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.${{ github.run_number }}
          name: Bayiku 5.1 (build ${{ github.run_number }})
          body: Unduh Bayiku.apk di bawah, lalu pasang di HP Android.
          files: Bayiku.apk
