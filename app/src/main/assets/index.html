<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Bayiku</title>
<style>
/* VOICE: hangat, tenang, membumi — enak dilihat jam 3 pagi
   IDEA: jurnal bayi bersampul kain linen, warna tanah liat & pasir
   PICTURE: kartu sampul terakota dengan bukit & matahari, timer besar
   COLOUR/TYPE: earth tone (terakota, pasir, zaitun, mauve, kopi); Fraunces + Nunito
   LAYOUT: satu kolom, kartu bulat, navigasi pil mengambang */
@font-face{font-family:Fraunces;src:url(fonts/fraunces-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Fraunces;src:url(fonts/fraunces-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
:root{color-scheme:light;
 --bg:#f4ede3;--card:#fffaf3;--ink:#3a2c24;--muted:#8a7a6d;--line:#e7dccd;
 --teal:#b0573a;--teal2:#f3e0d4;           /* terakota: aksi utama */
 --peach:#e6bf94;--peach2:#f6e6d4;         /* pasir: menyusu */
 --sky:#e2e6d3;--sky-i:#5f6d3c;            /* zaitun: botol, imunisasi */
 --lav:#ecdfe2;--lav-i:#80586a;            /* mauve: tidur */
 --sun:#f4e5c3;--sun-i:#94661a;            /* oker: popok */
 --red:#a3412a;--red2:#f5d9cf;
 --hero1:#b0573a;--hero2:#7d4a34;--heroInk:#fff6ec;
 --shadow:0 1px 2px rgba(80,50,30,.06),0 6px 18px rgba(80,50,30,.07)}
:root[data-theme=dark]{color-scheme:dark;
 --bg:#1c1713;--card:#28211c;--ink:#f1e7da;--muted:#ab9a8a;--line:#3a3029;
 --teal:#e08a64;--teal2:#3d2a21;--peach:#d9a978;--peach2:#3a2c21;--sky:#2c3122;--sky-i:#b9c58f;
 --lav:#33262c;--lav-i:#d4aebf;--sun:#3a2f1a;--sun-i:#e3b65c;--red:#ef8f71;--red2:#3e241c;
 --hero1:#6e3a26;--hero2:#3a2519;--heroInk:#fbeee0;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;transition:background-color .25s}
body{padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
h1,h2,h3,.big,.stat .v,.grow b,.setup h1{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
/* sampul */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:18px 18px 16px;margin-bottom:14px;color:var(--heroInk);background:linear-gradient(150deg,var(--hero1),var(--hero2));box-shadow:var(--shadow)}
.hero svg.deco{position:absolute;inset:auto 0 0 0;width:100%;height:96px;pointer-events:none;opacity:.9}
.hero .top{position:relative;display:flex;align-items:center;gap:12px}
.hero h1{margin:0;font-size:30px;line-height:1.05;font-weight:700}
.hero .age{font-size:14px;opacity:.85;font-weight:600}
.av{width:48px;height:48px;border-radius:50%;background:rgba(255,246,236,.18);border:2px solid rgba(255,246,236,.45);color:var(--heroInk);display:grid;place-items:center;font:700 22px Fraunces,Georgia,serif;flex:none}
.tbtn{margin-left:auto;width:44px;height:44px;border-radius:50%;background:rgba(255,246,236,.16);display:grid;place-items:center;color:var(--heroInk)}
.tbtn svg{width:22px;height:22px}
.grow{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.grow button{background:rgba(255,246,236,.14);border:1px solid rgba(255,246,236,.22);backdrop-filter:blur(4px);border-radius:16px;padding:9px 11px;text-align:left;color:var(--heroInk)}
.grow small{display:block;opacity:.8;font-size:12px;font-weight:600}
.grow b{font-size:21px;font-weight:700}.grow b span{font:600 12px Nunito,sans-serif;opacity:.8}
/* kartu */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.timer{background:var(--peach2);border-color:transparent;position:relative;overflow:hidden}
.timer::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:currentColor;opacity:.06}
.timer .lbl{color:var(--red);font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.timer .lbl::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.timer .big{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:50px;border-radius:999px;padding:10px 16px;font-weight:800;background:var(--card);color:var(--ink);border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--peach);color:#3f2616;border-color:transparent}
.btn.teal{background:var(--teal);color:#fff8f0;border-color:transparent}
.btn.ghost{background:var(--teal2);color:var(--teal);border-color:transparent}
.btn.danger{background:var(--red2);color:var(--red);border-color:transparent}
.feedgo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.feedgo button{border-radius:22px;padding:14px;text-align:left;background:var(--peach2);color:var(--ink);display:flex;align-items:center;gap:10px;font-weight:800;min-height:64px;border:1px solid transparent}
.feedgo button .ico{background:var(--card);color:var(--red)}
.feedgo button small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.vax{background:var(--sky);border-color:transparent;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.vax.late{background:var(--red2)}
.ico{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
h2{font-size:21px;margin:22px 2px 10px;font-weight:700}
.today{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left;box-shadow:var(--shadow)}
.stat .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.stat .t .ico{width:32px;height:32px;border-radius:11px}
.stat .t .ico svg{width:18px;height:18px}
.stat .v{font-size:26px;font-weight:700;margin:10px 0 0;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .s{color:var(--muted);font-size:13px}
.stat .f{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px;font-size:13px;font-weight:800}
.c-feed{color:var(--red)}.c-sleep{color:var(--lav-i)}.c-diap{color:var(--sun-i)}.c-tum{color:var(--teal)}.c-bot{color:var(--sky-i)}
.b-feed{background:var(--peach2)!important}.b-sleep{background:var(--lav)!important}.b-diap{background:var(--sun)!important}.b-tum{background:var(--teal2)!important}.b-bot{background:var(--sky)!important}
.fab{position:fixed;right:22px;bottom:calc(104px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:22px;background:var(--teal);color:#fff8f0;font-size:34px;box-shadow:0 10px 24px rgba(120,60,30,.35);display:grid;place-items:center;z-index:5}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 8px 28px rgba(60,35,20,.16);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:6}
nav button{padding:6px 0 7px;font-size:11.5px;font-weight:700;color:var(--muted);display:grid;justify-items:center;gap:2px;min-height:56px;border-radius:20px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--teal);background:var(--teal2)}
.sheet-bg{position:fixed;inset:0;background:rgba(40,25,15,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.timer .lbl::before{animation:none}}
.sheet h3{margin:0 0 14px;font-size:23px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 6px;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:800;text-align:center;min-height:96px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 5px;font-weight:700}
input,select,textarea{width:100%;min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:10px 14px;font-size:16px}
textarea{min-height:110px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:999px;font-weight:800;color:var(--muted);font-size:14px}
.seg button.on{background:var(--teal);color:#fff8f0}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .ico{width:38px;height:38px;border-radius:13px}
.item .ico svg{width:19px;height:19px}
.item .m{flex:1}.item .m b{display:block;font-size:15px}.item .m small{color:var(--muted);font-size:13px}
.item .tm{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.day{font:700 17px Fraunces,Georgia,serif;margin:20px 4px 8px}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800}
.chk.on{background:var(--teal);border-color:var(--teal);color:#fff8f0}
.tag{font:800 12px Nunito,sans-serif;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.late{background:var(--red2);color:var(--red)}.tag.soon{background:var(--sun);color:var(--sun-i)}.tag.done{background:var(--sky);color:var(--sky-i)}
.muted{color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:32px 14px;background:var(--card);border:1px dashed var(--line);border-radius:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(178px + env(safe-area-inset-bottom));background:#3a2c24;color:#fff6ec;border-radius:999px;padding:11px 18px;display:none;gap:14px;align-items:center;z-index:20;font-size:14px;font-weight:700;max-width:92vw;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.toast.show{display:flex}.toast button{color:#f0b48f;font-weight:800}
.chart{height:200px;position:relative}.chart svg{position:absolute;inset:0;width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.chart.tall{height:260px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px;font-weight:700}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.zbox{border-radius:16px;padding:11px 13px;margin-top:10px;font-size:14px;background:var(--sky)}.zbox.warn{background:var(--red2)}
.ms{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);width:100%;text-align:left}.ms:last-child{border-bottom:0}
.ms .m b{display:block;font-family:Fraunces,Georgia,serif;font-size:17px}
.ms .ph{width:68px;height:68px;border-radius:18px;background:var(--teal2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--teal)}
.ms .ph img,.prev img{width:100%;height:100%;object-fit:cover;display:block}
.prev{width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--card);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);margin-top:6px;font-weight:700}
.med{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.med button{border-radius:999px;padding:8px 14px;min-height:40px;background:var(--bg);border:1px solid var(--line);font-weight:800;font-size:14px}.med button.on{background:var(--sky-i);border-color:transparent;color:#fff8f0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-weight:700}.sw input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--teal)}
.card>b{font:700 18px Fraunces,Georgia,serif}
.setup{max-width:480px;margin:5vh auto;padding:0 20px}
.setup .hero{padding:26px 22px 110px}
.setup h1{font-size:36px;line-height:1.05;margin:0 0 8px;color:var(--heroInk)}
.setup .hero p{margin:0;opacity:.9}
</style>
</head>

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.entries){const b=Object.assign(blank(),d);b.settings=Object.assign({},DEF_SET,d.settings||{});return b}}catch(e){}return blank()}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dec=v=>String(v).replace('.',',');
const mlTxt=m=>m.ml!=null&&m.ml!==''?dec(m.ml)+' ml':(m.dose||'');
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const tgl=t=>{const d=new Date(t);return d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()};
const dur=ms=>{ms=Math.max(0,ms);const m=Math.round(ms/60000);if(m<60)return m+'m';return Math.floor(m/60)+'j '+(m%60)+'m'};
const clock=ms=>{const s=Math.floor(Math.max(0,ms)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+pad(m):m)+':'+pad(x)};
const ago=t=>{const ms=Date.now()-t;if(ms<60000)return'baru saja';return dur(ms)+' lalu'};
const toLocalInput=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const fromLocalInput=v=>new Date(v).getTime();
const birthTs=()=>{const[y,m,d]=S.profile.birth.split('-').map(Number);return new Date(y,m-1,d).getTime()};
function addMonths(ts,n){const d=new Date(ts);const day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<day)d.setDate(0);return startOfDay(d.getTime())}
function readPrem(px){const n=id=>{const v=$('#'+px+id).value;return v===''?null:Number(v)};return{gaW:n('Ga'),gaD:n('GaD')||0,hpl:$('#'+px+'Hpl').value||null,bw:n('Bw')}}
const dk2ts=v=>{const[y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d).getTime()};
/* HPL: dari isian HPL, atau dihitung dari usia kehamilan saat lahir (40 minggu = 280 hari) */
function hplTs(){const p=S.profile;if(!p)return null;if(p.hpl)return dk2ts(p.hpl);if(p.gaW)return birthTs()+(280-(p.gaW*7+(p.gaD||0)))*864e5;return null}
function gaDays(){const p=S.profile;if(p.gaW)return p.gaW*7+(p.gaD||0);const h=hplTs();return h?280-Math.round((h-birthTs())/864e5):null}
function isPrem(){const g=gaDays();return g!=null&&g<259}
const corrBase=()=>{const h=hplTs();return isPrem()&&h&&h>birthTs()?h:birthTs()};
function corrText(){const h=hplTs();if(!isPrem()||!h||h<=birthTs())return'';const now=startOfDay(Date.now());if(now<h){const d=Math.round((h-now)/864e5),pma=gaDays()+Math.round((now-birthTs())/864e5);return'Usia koreksi: '+Math.ceil(d/7)+' mgg sebelum HPL · '+Math.floor(pma/7)+'+'+(pma%7)+' mgg'}
 const days=Math.round((now-h)/864e5);if(days<60)return'Usia koreksi: '+days+' hari';let m=0;while(addMonths(h,m+1)<=now)m++;const rest=Math.round((now-addMonths(h,m))/864e5);return'Usia koreksi: '+m+' bln'+(rest?' '+rest+' hr':'')}
function ageText(){const b=birthTs(),now=startOfDay(Date.now());const days=Math.round((now-b)/864e5);if(days<0)return'Belum lahir';if(days<60)return days+' hari';let m=0;while(addMonths(b,m+1)<=now)m++;const rest=Math.round((now-addMonths(b,m))/864e5);return m+' bulan'+(rest?' '+rest+' hari':'')}
const TYPES={feed:['Menyusu',I.feed,'feed'],bottle:['Botol',I.bottle,'bot'],sleep:['Tidur',I.sleep,'sleep'],diaper:['Popok',I.diaper,'diap'],tummy:['Tummy time',I.tummy,'tum'],growth:['Pertumbuhan',I.grow,'tum'],temp:['Suhu & napas',I.temp,'bot'],note:['Catatan',I.note,'diap'],med:['Obat / vitamin',I.temp,'tum'],pmk:['PMK (kanguru)',I.sleep,'sleep'],vomit:['Muntah',I.diaper,'diap'],visit:['Kunjungan / kontrol',I.note,'bot'],pijat:['Pijat bayi',I.tummy,'tum'],pump:['Perah ASI',I.bottle,'feed'],skin:['Pelembap kulit',I.note,'tum']};
function sideName(s){return s==='L'?'Kiri':'Kanan'}
function describe(e){
 switch(e.type){
  case'feed':return['Menyusu · '+sideName(e.side),dur(e.dur)];
  case'bottle':return['Minum · '+esc(e.milk)+(e.cara&&e.cara!=='Botol'?' ('+esc(e.cara).toLowerCase()+')':''),e.ml+' ml'];
  case'sleep':return['Tidur',dur(e.end-e.t)];
  case'tummy':return['Tummy time',dur(e.end-e.t)];
  case'diaper':return['Popok · '+({pipis:'Pipis',pup:'Pup',keduanya:'Pipis + pup'}[e.kind]),''];
  case'growth':return['Pertumbuhan',[e.w&&dec(e.w)+' kg',e.l&&dec(e.l)+' cm',e.hc&&'LK '+dec(e.hc)+' cm'].filter(Boolean).join(' · ')];
  case'temp':return['Suhu & napas',[e.c&&dec(e.c)+' °C',e.rr&&e.rr+' x/menit'].filter(Boolean).join(' · ')];
  case'pmk':return['PMK (kanguru)',dur(e.end-e.t)];
  case'vomit':return['Muntah · '+esc(e.kind||'Biasa'),e.ml?e.ml+' ml':''];
  case'visit':return['Kunjungan'+(e.place?' · '+esc(e.place):''),esc(e.saran||e.keluhan||'')+(e.back?' · kembali '+tgl(dk2ts(e.back)):'')];
  case'pump':return['Perah ASI'+(e.side?' · '+esc(e.side):''),e.ml!=null?e.ml+' ml':''];
  case'skin':return['Pelembap kulit',''];
  case'pijat':return['Pijat bayi',e.dur?Math.round(e.dur/6e4)+' menit':''];
  case'note':return['Catatan',esc(e.text)];
  case'med':return['Vitamin/obat · '+esc(e.name),esc(mlTxt(e))+(e.slot?' (jadwal '+e.slot+')':'')];
 }return['',''];
}

function header(withGrow){const d=isDark(),g=withGrow?lastGrowth():null;return`<section class="hero"><svg class="deco" viewBox="0 0 400 96" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path d="M0 66 C70 38 140 58 210 50 C280 42 340 60 400 46 V96 H0Z" fill="#fff6ec" opacity=".09"/><path d="M0 82 C80 62 150 78 220 72 C290 66 345 82 400 74 V96 H0Z" fill="#fff6ec" opacity=".13"/><path d="M40 70 q6 -14 12 0 M60 74 q5 -11 10 0" stroke="#fff6ec" stroke-opacity=".25" stroke-width="2" fill="none"/></svg><div class="top"><div class="av">${esc(S.profile.name[0]||'?').toUpperCase()}</div><div><h1>${esc(S.profile.name)}</h1><div class="age">${ageText()}${corrText()?'<br>'+corrText():''}</div></div><button class="tbtn" data-a="themeToggle" aria-label="${d?'Ganti ke mode terang':'Ganti ke mode gelap'}">${d?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'}</button></div>${g?`<div class="grow">${[['Berat',g.w,'kg'],['Panjang',g.l,'cm'],['L. kepala',g.hc,'cm']].map(([n,v,u])=>`<button data-a="growth"><small>${n}</small><b>${v!=null?dec(v):'–'} <span>${u}</span></b></button>`).join('')}</div>`:''}</section>`}
function lastGrowth(){const g={};for(const e of sorted())if(e.type==='growth'){if(g.w==null&&e.w)g.w=e.w;if(g.l==null&&e.l)g.l=e.l;if(g.hc==null&&e.hc)g.hc=e.hc}return g}
function vHome(){
 const g=lastGrowth(),T=S.timers,now=Date.now(),sod=startOfDay(now);

/* ===== Sinkron 2 HP (Firebase Firestore) =====
   Data tetap tersimpan lokal; sinkron hanya menyalin perubahan ke/dari Firestore.
   Jalur: fam/{kode}/e/{idCatatan}, fam/{kode}/s/main (profil & data bersama), fam/{kode}/p/{idFoto}. */
const SHARED=['profile','vax','prem','dev','meds','milestones','stock','timers'];
let SY={joining:false,db:null,unsubs:[],sent:new Map(),sharedSent:'',applying:false,timer:null,status:'off',err:''};
function syncCfg(){return S.sync&&S.sync.on&&S.sync.code&&S.sync.config?S.sync:null}
function loadScript(src){return new Promise((res,rej)=>{const x=document.createElement('script');x.src=src;x.onload=res;x.onerror=()=>rej(new Error('Gagal memuat '+src));document.head.appendChild(x)})}
async function syncStart(){const c=syncCfg();if(!c)return;if(SY.db)return;
 SY.status='menghubungkan';try{
  if(!window.firebase){await loadScript('lib/firebase-app-compat.js');await loadScript('lib/firebase-firestore-compat.js')}
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(c.config);
  const db=app.firestore();try{db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
  try{await db.enablePersistence({synchronizeTabs:false})}catch(e){}
  SY.db=db;const base=db.collection('fam').doc(c.code);
  SY.unsubs.push(base.collection('e').onSnapshot(snap=>remoteEntries(snap),err=>syncFail(err)));
  SY.unsubs.push(base.collection('s').doc('main').onSnapshot(d=>remoteShared(d),err=>syncFail(err)));
  SY.status='aktif';syncPush(true);
 }catch(e){syncFail(e)}}
function syncStop(){SY.unsubs.forEach(u=>{try{u()}catch(e){}});SY.unsubs=[];SY.db=null;SY.status='off'}
function syncFail(e){SY.status='error';SY.err=(e&&(e.code||e.message))||String(e);if(tab==='set')render()}
function sharedJSON(){const o={};for(const k of SHARED)o[k]=S[k]??null;return JSON.stringify(o)}
function entryJSON(e){return JSON.stringify(e)}
/* kirim perubahan lokal (dipanggil setelah save) */
function syncPush(now){if(!SY.db||SY.applying)return;clearTimeout(SY.timer);SY.timer=setTimeout(syncFlush,now?0:700)}
async function syncFlush(){const c=syncCfg();if(!SY.db||!c)return;const base=SY.db.collection('fam').doc(c.code);
 try{const cur=new Map(S.entries.map(e=>[e.id,entryJSON(e)]));const batch=SY.db.batch();let n=0;
  for(const[id,j]of cur){if(SY.sent.get(id)!==j){batch.set(base.collection('e').doc(id),Object.assign(JSON.parse(j),{_by:S.sync.device||'',_at:Date.now()}));SY.sent.set(id,j);n++}}
  for(const id of [...SY.sent.keys()]){if(!cur.has(id)){batch.delete(base.collection('e').doc(id));SY.sent.delete(id);n++}}
  const sj=sharedJSON();if(!SY.joining&&sj!==SY.sharedSent){batch.set(base.collection('s').doc('main'),{data:sj,_by:S.sync.device||'',_at:Date.now()});SY.sharedSent=sj;n++}
  if(n)await batch.commit();
  for(const m of S.milestones){if(m.photo&&!(S.sync.photos||{})[m.id]){const u=await idb('get',m.id).catch(()=>null);if(u&&u.length<900000){await base.collection('p').doc(m.id).set({data:u});S.sync.photos=Object.assign({},S.sync.photos,{[m.id]:1});localSave()}}}
  S.sync.last=Date.now();localSave();
 }catch(e){syncFail(e)}}
function remoteEntries(snap){let changed=false;SY.applying=true;
 for(const ch of snap.docChanges()){const id=ch.doc.id;
  if(ch.type==='removed'){const i=S.entries.findIndex(e=>e.id===id);if(i>=0){S.entries.splice(i,1);changed=true}SY.sent.delete(id);continue}
  const d=Object.assign({},ch.doc.data());delete d._by;delete d._at;d.id=id;const j=entryJSON(d);SY.sent.set(id,j);
  const i=S.entries.findIndex(e=>e.id===id);if(i<0){S.entries.push(d);changed=true}else if(entryJSON(S.entries[i])!==j){S.entries[i]=d;changed=true}}
 SY.applying=false;S.sync.last=Date.now();
 if(changed){localSave();softRender()}
 /* catatan lokal yang belum ada di server (mis. dibuat sebelum sinkron aktif) ikut dikirim */
 if(!snap.metadata.fromCache)syncPush()}
function remoteShared(d){if(d.metadata&&d.metadata.fromCache&&!d.exists)return;const wasJoin=SY.joining;SY.joining=false;if(!d.exists){syncPush(true);return}const v=d.data();if(!v||!v.data||v.data===SY.sharedSent)return;
 let o;try{o=JSON.parse(v.data)}catch(e){return}
 SY.applying=true;for(const k of SHARED)if(o[k]!==undefined&&o[k]!==null)S[k]=o[k];SY.applying=false;SY.sharedSent=v.data;
 localSave();softRender();
 for(const m of S.milestones||[]){if(m.photo)idb('get',m.id).then(u=>{if(!u&&SY.db)SY.db.collection('fam').doc(S.sync.code).collection('p').doc(m.id).get().then(x=>{if(x.exists){idb('put',m.id,x.data().data);S.sync.photos=Object.assign({},S.sync.photos,{[m.id]:1});localSave()}})}).catch(()=>{})}}

function newCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(20));for(const x of r)s+=a[x%a.length];return s}
function packLink(){return'BAYIKU1:'+btoa(unescape(encodeURIComponent(JSON.stringify({c:S.sync.code,f:S.sync.config}))))}
function unpackLink(t){t=t.trim();if(!t.startsWith('BAYIKU1:'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(8)))));if(!o.c||!o.f||!o.f.projectId)throw 0;return o}
function parseConfig(t){/* terima JSON atau potongan "const firebaseConfig = {...}" dari Firebase console */
 let m=t.match(/\{[\s\S]*\}/);if(!m)throw 0;let j=m[0].replace(/\/\/[^\n]*/g,'').replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*\}/g,'}');const o=JSON.parse(j);if(!o.apiKey||!o.projectId)throw 0;return{apiKey:o.apiKey,authDomain:o.authDomain,projectId:o.projectId,storageBucket:o.storageBucket,messagingSenderId:o.messagingSenderId,appId:o.appId}}

 const ed=!!e;e=e||{t:Date.now()};let f='';
 if(type==='bottle')f=`<label>Cara minum</label><div class="seg" data-seg="cara">${['Botol','Sendok','Cup','Sonde'].map(m=>`<button type="button" data-v="${m}" class="${(e.cara||'Botol')===m?'on':''}">${m}</button>`).join('')}</div><label>Jenis susu</label><div class="seg" data-seg="milk">${['ASIP','ASI donor','Sufor'].map(m=>`<button type="button" data-v="${m}" class="${(e.milk||'ASIP')===m?'on':''}">${m}</button>`).join('')}</div><label for="fMl">Jumlah (ml)</label><input id="fMl" type="number" inputmode="numeric" min="1" required value="${e.ml||''}">`+timeField('fT',e.t);
 if(type==='diaper')f=`<label>Isi popok</label><div class="seg" data-seg="kind">${[['pipis','Pipis'],['pup','Pup'],['keduanya','Keduanya']].map(([v,n])=>`<button type="button" data-v="${v}" class="${(e.kind||'pipis')===v?'on':''}">${n}</button>`).join('')}</div>`+timeField('fT',e.t);
 if(type==='growth')f=`<label for="fW">Berat badan (kg atau gram)</label><input id="fW" type="number" inputmode="decimal" step="any" min="0" value="${e.w||''}" placeholder="mis. 3,53 atau 3530"><label for="fL">Panjang (cm)</label><input id="fL" type="number" inputmode="decimal" step="0.1" min="0" value="${e.l||''}"><label for="fH">Lingkar kepala (cm)</label><input id="fH" type="number" inputmode="decimal" step="0.1" min="0" value="${e.hc||''}">`+timeField('fT',e.t,'Tanggal ukur');
 if(type==='temp')f=`<label for="fC">Suhu (°C)</label><input id="fC" type="number" inputmode="decimal" step="0.1" min="30" max="45" value="${e.c||''}" placeholder="mis. 36,8"><label for="fR">Napas (kali per menit) — opsional</label><input id="fR" type="number" inputmode="numeric" min="10" max="150" value="${e.rr||''}" placeholder="hitung selama 1 menit penuh"><p class="muted" style="margin:6px 0 0">Normal: suhu 36,5–37,5 °C; napas tidak lebih dari 60 kali/menit.</p>`+timeField('fT',e.t);
 if(type==='vomit')f=`<label>Jenis muntah</label><div class="seg" data-seg="kind">${['Biasa','Hijau','Darah'].map(v=>`<button type="button" data-v="${v}" class="${(e.kind||'Biasa')===v?'on':''}">${v}</button>`).join('')}</div><label for="fMl">Perkiraan jumlah (ml) — opsional</label><input id="fMl" type="number" inputmode="numeric" min="0" value="${e.ml||''}">`+timeField('fT',e.t);
 if(type==='pump')f=`<label>Payudara</label><div class="seg" data-seg="side">${['Kiri','Kanan','Keduanya'].map(v=>`<button type="button" data-v="${v}" class="${(e.side||'Keduanya')===v?'on':''}">${v}</button>`).join('')}</div><label for="fMl">Hasil perah (ml)</label><input id="fMl" type="number" inputmode="numeric" min="0" value="${e.ml??''}">`+timeField('fT',e.t)+`<p class="muted" style="margin:8px 0 0">Buku KBK: perah 8–12 kali sehari (tiap 2–3 jam) termasuk malam; lanjutkan 2 menit setelah tetes terakhir.</p>`;
 if(type==='skin')f=timeField('fT',e.t)+`<p class="muted" style="margin:8px 0 0">Oleskan pelembap minimal tiap 8 jam. Pilih minyak alami (zaitun/kelapa/bunga matahari); hindari yang beralkohol, pewangi, pewarna, pengawet.</p>`;
 if(type==='pijat')f=timeField('fT',e.t)+`<label for="fD">Lama (menit)</label><input id="fD" type="number" inputmode="numeric" min="1" value="${e.dur?Math.round(e.dur/6e4):10}">`;
 if(type==='visit')f=`<label for="vPl">Tempat / dokter</label><input id="vPl" value="${esc(e.place||'')}" placeholder="mis. dr. Sp.A RS ..."><label for="vK">Keluhan</label><textarea id="vK" style="min-height:70px">${esc(e.keluhan||'')}</textarea><label for="vS">Pemeriksaan, tindakan, saran</label><textarea id="vS" style="min-height:90px">${esc(e.saran||'')}</textarea><label for="vB">Tanggal kembali (kontrol berikutnya)</label><input id="vB" type="date" value="${esc(e.back||'')}">`+timeField('fT',e.t,'Tanggal kunjungan');
 if(type==='note')f=`<label for="fN">Catatan (obat, gejala, dll.)</label><textarea id="fN" required>${esc(e.text||'')}</textarea>`+timeField('fT',e.t);
 if(type==='feed')f=`<label>Sisi</label><div class="seg" data-seg="side">${[['L','Kiri'],['R','Kanan']].map(([v,n])=>`<button type="button" data-v="${v}" class="${(e.side||'L')===v?'on':''}">${n}</button>`).join('')}</div>`+timeField('fT',e.t,'Mulai')+`<label for="fD">Lama (menit)</label><input id="fD" type="number" inputmode="numeric" min="1" required value="${e.dur?Math.round(e.dur/60000):''}">`;
 if(type==='sleep'||type==='tummy'||type==='pmk')f=timeField('fT',e.t,'Mulai')+timeField('fE',e.end||Date.now(),'Selesai');
 openSheet(`<h3>${ed?'Ubah':''} ${TYPES[type][0]}</h3><form id="entryForm" data-type="${type}" data-id="${ed?e.id:''}">${f}<div style="height:16px"></div><div class="row">${ed?'<button type="button" class="btn danger" data-a="del">Hapus</button>':''}<button class="btn teal">Simpan</button></div></form>`);
}
function medSheet(m){const ed=!!m;m=m||{name:'',ml:'',times:[],on:true};
 openSheet(`<h3>${ed?'Ubah':'Tambah'} vitamin / obat</h3><form id="medForm" data-id="${ed?m.id:''}"><label for="mN">Nama</label><input id="mN" required value="${esc(m.name)}" placeholder="mis. Vitamin D, DHA">
 <label for="mD">Jumlah per pemberian (ml)</label><input id="mD" type="number" inputmode="decimal" step="0.1" min="0" value="${m.ml!=null?esc(m.ml):''}" placeholder="mis. 0,5">
 <label for="mT">Jam pengingat (opsional, pisahkan dengan koma)</label><input id="mT" value="${esc((m.times||[]).join(', '))}" placeholder="mis. 08:00, 20:00 — kosongkan jika tidak perlu">
 <div class="sw" style="margin-top:8px"><span>Tampilkan di Beranda & beri pengingat</span><input type="checkbox" id="mOn" ${m.on?'checked':''}></div>
 <div style="height:14px"></div><div class="row">${ed?'<button type="button" class="btn danger" data-a="medDel">Hapus</button>':''}<button class="btn teal">Simpan</button></div></form>`)}
function medLogSheet(){
 openSheet(`<h3>Catat vitamin / obat</h3>${S.meds.length?`<form id="medLogForm"><label for="lM">Pilih</label><select id="lM">${S.meds.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
 <label for="lMl">Jumlah (ml)</label><input id="lMl" type="number" inputmode="decimal" step="0.1" min="0" value="${S.meds[0].ml??''}">`+timeField('lT',Date.now())+`
 <div style="height:14px"></div><button class="btn teal" style="width:100%">Simpan</button></form><div style="height:10px"></div>`:'<p class="muted">Belum ada vitamin/obat. Tambahkan dulu, misalnya Vitamin D atau DHA.</p>'}
 <button class="btn ghost" style="width:100%" data-a="medNew">Tambah vitamin / obat baru</button>`)}
function msSheet(m){const ed=!!m;m=m||{title:'',date:startOfDay(Date.now()),note:'',photo:false};photoDraft=null;
 openSheet(`<h3>${ed?'Ubah momen':'Momen baru'}</h3><form id="msForm" data-id="${ed?m.id:''}"><label for="msT">Momen</label><input id="msT" list="msList" required value="${esc(m.title)}" placeholder="pilih atau ketik sendiri"><datalist id="msList">${MS_PRESET.map(x=>`<option value="${x}">`).join('')}</datalist>
 <label for="msD">Tanggal</label><input id="msD" type="date" required value="${dayKey(m.date)}">
 <label for="msN">Cerita singkat (opsional)</label><textarea id="msN" style="min-height:80px">${esc(m.note||'')}</textarea>
 <label>Foto</label><button type="button" class="prev" data-a="msPhoto" id="msPrev">${m.photo?'':'Ketuk untuk pilih foto'}</button>
 <div style="height:14px"></div><div class="row">${ed?'<button type="button" class="btn danger" data-a="msDel">Hapus</button>':''}<button class="btn teal">Simpan</button></div></form>`);
 if(m.photo)idb('get',m.id).then(u=>{if(u&&$('#msPrev'))$('#msPrev').innerHTML='<img alt="" src="'+u+'">'})}
function premSheet(k){const it=PREM.find(x=>x.k===k),d=(S.prem||{})[k],fs=it.res?RES[it.res]:[];
 openSheet(`<h3>${it.t}</h3><p class="muted">${it.when}</p><form id="premForm" data-k="${k}"><label for="prD">Tanggal pemeriksaan</label><input id="prD" type="date" required value="${dayKey(d?d.t:Date.now())}">
 ${fs.map(([lb,opts],i)=>`<label for="prR${i}">${lb}</label><select id="prR${i}" data-lb="${lb}"><option value="">–</option>${opts.map(o=>`<option ${d&&d.res&&d.res[lb]===o?'selected':''}>${o}</option>`).join('')}</select>`).join('')}
 <label for="prN">Hasil / catatan dokter</label><textarea id="prN" style="min-height:80px" placeholder="mis. normal, kontrol 2 minggu lagi">${esc(d?d.note:'')}</textarea>
 <div style="height:14px"></div><div class="row">${d?'<button type="button" class="btn danger" data-a="premDel">Hapus</button>':''}<button class="btn teal">Simpan</button></div></form>`)}
function logDose(id,slot){const m=S.meds.find(x=>x.id===id);if(!m)return;S.entries.push({id:uid(),type:'med',t:Date.now(),medId:id,name:m.name,ml:m.ml,dose:m.dose,slot:slot||null});save();render();toast(m.name+' dicatat')}
function sheetPast(){openSheet(`<h3>Catat yang sudah lewat</h3><div class="grid3">${['feed','sleep','tummy','bottle','diaper','temp','pmk','pump','skin','vomit','visit','pijat','note'].map(t=>`<button class="tile" data-form="${t}"><span class="ico b-${TYPES[t][2]} c-${TYPES[t][2]}">${TYPES[t][1]}</span>${TYPES[t][0]}</button>`).join('')}</div>`)}
function submitEntry(form){
 const type=form.dataset.type,id=form.dataset.id,old=id?S.entries.find(e=>e.id===id):null;
 const seg=n=>{const b=form.querySelector(`[data-seg="${n}"] .on`);return b&&b.dataset.v};
 const num=s=>{const v=form.querySelector(s).value;return v===''?null:Number(String(v).replace(',','.'))};
 const t=fromLocalInput(form.querySelector('#fT').value);if(!t)return toast('Waktu belum diisi');
 const e={id:id||uid(),type,t};
 if(type==='bottle'){e.milk=seg('milk');e.ml=num('#fMl')}
 if(type==='diaper'){e.kind=seg('kind');if(!old&&S.stock.diapers>0)S.stock.diapers--}
 if(type==='growth'){e.w=num('#fW');if(e.w>=100)e.w=Math.round(e.w)/1000;e.l=num('#fL');e.hc=num('#fH');if(!e.w&&!e.l&&!e.hc)return toast('Isi minimal satu ukuran')}
 if(type==='temp'){e.c=num('#fC');e.rr=num('#fR');if(!e.c&&!e.rr)return toast('Isi suhu atau napas')}
 if(type==='bottle')e.cara=seg('cara');
 if(type==='vomit'){e.kind=seg('kind');e.ml=num('#fMl')}
 if(type==='pump'){e.side=seg('side');e.ml=num('#fMl')}
 if(type==='pijat'){e.dur=(num('#fD')||0)*6e4;e.end=t+e.dur}
 if(type==='visit'){e.place=$('#vPl').value.trim();e.keluhan=$('#vK').value.trim();e.saran=$('#vS').value.trim();e.back=$('#vB').value||null}
 if(type==='note')e.text=form.querySelector('#fN').value.trim();
 if(type==='feed'){e.side=seg('side');e.dur=num('#fD')*60000;e.end=t+e.dur}
 if(type==='sleep'||type==='tummy'||type==='pmk'){e.end=fromLocalInput(form.querySelector('#fE').value);if(!(e.end>t))return toast('Jam selesai harus setelah jam mulai')}
 if(old)Object.assign(old,e);else S.entries.push(e);
 save();closeSheet();render();toast(old?'Perubahan disimpan':'Tersimpan');vitalAlert(e);if(type==='visit'&&e.back)askNotif();
}

/* ---------- ACTIONS ---------- */
function act(a,el){
 const T=S.timers,now=Date.now();
 switch(a){
  case'add':sheetAdd();break;
  case'past':sheetPast();break;
  case'feedStart':if(T.feed){toast('Masih ada sesi menyusu berjalan');closeSheet();break}T.feed={side:el.dataset.side,start:now,pausedMs:0};save();closeSheet();tab='home';render();break;
  case'feedPause':{const f=T.feed;if(f.pausedAt){f.pausedMs+=now-f.pausedAt;delete f.pausedAt}else f.pausedAt=now;save();render();break}
  case'feedSwitch':{const f=T.feed;finishFeed();T.feed={side:f.side==='L'?'R':'L',start:Date.now(),pausedMs:0};save();render();break}
  case'feedStop':finishFeed();save();render();toast('Menyusu dicatat');break;
  case'sleepStart':if(T.sleep){toast('Bayi sedang tidur');break}T.sleep={start:now};save();closeSheet();tab='home';render();break;
  case'tummyStart':if(T.tummy){toast('Tummy time sedang berjalan');break}T.tummy={start:now};save();closeSheet();tab='home';render();break;
  case'stop':{const k=el.dataset.k,x=T[k];if(now-x.start<30000){delete T[k];save();render();toast('Terlalu singkat, tidak dicatat');break}S.entries.push({id:uid(),type:k,t:x.start,end:now});delete T[k];save();render();toast({sleep:'Tidur dicatat',tummy:'Tummy time dicatat',pmk:'PMK dicatat'}[k]);break}
  case'cancel':delete T[el.dataset.k];save();render();break;
  case'bottle':case'diaper':case'growth':case'temp':case'note':case'vomit':case'pump':case'skin':formSheet(a);break;
  case'del':{const id=$('#entryForm').dataset.id,i=S.entries.findIndex(e=>e.id===id);if(i<0)break;const [rm]=S.entries.splice(i,1);save();closeSheet();render();toast('Catatan dihapus',()=>{S.entries.push(rm);save();render()});break}
  case'export':doExport();break;
  case'import':$('#fileIn').click();break;
  case'wipe':openSheet(`<h3>Hapus semua data?</h3><p>Semua catatan ${esc(S.profile.name)} akan hilang dari HP ini dan tidak bisa dikembalikan. Simpan cadangan dulu jika perlu.</p><div class="row"><button class="btn" data-a="close">Batal</button><button class="btn danger" data-a="wipeYes">Ya, hapus</button></div>`);break;
  case'wipeYes':S=blank();save();closeSheet();tab='home';render();break;
  case'close':closeSheet();break;
  case'gv':growView=el.dataset.v;render();break;
  case'exportSheet':openSheet(`<h3>Ekspor riwayat</h3><label for="exP">Periode</label><select id="exP"><option value="1">Hari ini</option><option value="7" selected>7 hari terakhir</option><option value="30">30 hari terakhir</option><option value="0">Semua catatan</option></select>
   <p class="muted">Excel berisi lembar Riwayat, Ringkasan harian, Pertumbuhan, Imunisasi, dan Vitamin. PDF cocok dibawa saat kontrol ke dokter.</p><div class="row"><button class="btn teal" data-a="exXlsx">Excel (.xlsx)</button><button class="btn pri" data-a="exPdf">PDF</button></div>`);break;
  case'exXlsx':exportXlsx(+$('#exP').value);break;
  case'exPdf':exportPdf(+$('#exP').value);break;
  case'kbkData':kbkDataSheet();break;
  case'syncSetup':syncSetupSheet();break;
  case'syncJoin':syncJoinSheet();break;
  case'copyRules':copyText(FB_RULES,'Aturan disalin');break;
  case'syncShare':copyText(packLink(),'Kode sambung disalin. Kirim ke HP pasangan');break;
  case'syncNow':SY.sent.clear();SY.sharedSent='';if(!SY.db)syncStart();else syncPush(true);toast('Menyinkronkan…');break;
  case'syncOff':openSheet(`<h3>Putuskan sinkron?</h3><p>Catatan di HP ini tetap ada. HP ini tidak lagi menerima atau mengirim catatan.</p><div class="row"><button class="btn" data-a="close">Batal</button><button class="btn danger" data-a="syncOffYes">Putuskan</button></div>`);break;
  case'syncOffYes':syncStop();S.sync={on:false};save();closeSheet();render();break;
  case'pmkStart':if(S.timers.pmk){toast('PMK sedang berjalan');break}S.timers.pmk={start:Date.now()};save();closeSheet();tab='home';render();break;
  case'premDel':{const k=$('#premForm').dataset.k;if(S.prem)delete S.prem[k];save();closeSheet();render();break}
  case'themeToggle':S.settings.theme=isDark()?'light':'dark';save();render();toast(isDark()?'Mode gelap':'Mode terang');break;
  case'medNew':medSheet();break;
  case'medLog':medLogSheet();break;
  case'medDel':{const id=$('#medForm').dataset.id;S.meds=S.meds.filter(m=>m.id!==id);save();closeSheet();render();toast('Obat dihapus');break}
  case'msDel':{const id=$('#msForm').dataset.id;S.milestones=S.milestones.filter(m=>m.id!==id);idb('delete',id);save();closeSheet();render();toast('Momen dihapus');break}
  case'msPhoto':$('#photoIn').click();break;
 }
}
function finishFeed(){const f=S.timers.feed;if(!f)return;const d=feedElapsed(f);if(d>=15000)S.entries.push({id:uid(),type:'feed',side:f.side,t:f.start,end:f.pausedAt||Date.now(),dur:d});delete S.timers.feed}
const plain=h=>{const t=document.createElement('textarea');t.innerHTML=String(h);return t.value};
const LBL={pump:'Perah ASI',skin:'Pelembap',feed:'Menyusu',bottle:'Minum (botol/sendok)',sleep:'Tidur',tummy:'Tummy time',diaper:'Popok',growth:'Pertumbuhan',temp:'Suhu & napas',note:'Catatan',med:'Vitamin/obat',pmk:'PMK',vomit:'Muntah',visit:'Kunjungan',pijat:'Pijat'};
function periodEntries(days){const from=days===1?startOfDay(Date.now()):days?Date.now()-days*864e5:0;return S.entries.filter(e=>e.t>=from).sort((a,b)=>a.t-b.t)}
function periodName(days){return days===1?'Hari ini':days?days+' hari terakhir':'Semua catatan'}
function entryRow(e){const[t,v]=describe(e);const ms=e.type==='feed'||e.type==='pijat'?e.dur:e.end?e.end-e.t:null;return[tgl(e.t),hm(e.t),e.end?hm(e.end):'',LBL[e.type]||e.type,plain(t.split(' · ').slice(1).join(' · ')||'')+(v&&e.type!=='feed'&&e.type!=='sleep'&&e.type!=='tummy'?(t.includes(' · ')?' · ':'')+plain(v):''),ms!=null?Math.round(ms/60000):'']}
function dailyRows(list){const m=new Map();for(const e of list){const k=dayKey(e.t);if(!m.has(k))m.set(k,{t:e.t,fx:0,fm:0,ml:0,sl:0,pi:0,pu:0,tu:0,med:0});const d=m.get(k);
 if(e.type==='feed'){d.fx++;d.fm+=e.dur/6e4}if(e.type==='bottle')d.ml+=+e.ml||0;if(e.type==='sleep')d.sl+=(e.end-e.t)/36e5;if(e.type==='tummy')d.tu+=(e.end-e.t)/6e4;if(e.type==='diaper'){if(e.kind!=='pup')d.pi++;if(e.kind!=='pipis')d.pu++}if(e.type==='med')d.med++}
 return[...m.values()].map(d=>[tgl(d.t),d.fx,Math.round(d.fm),d.ml,Math.round(d.sl*10)/10,d.pi,d.pu,Math.round(d.tu),d.med])}
function exportName(ext){return'Bayiku-'+(S.profile.name||'bayi').replace(/\W+/g,'')+'-'+dayKey(Date.now())+'.'+ext}
function exportXlsx(days){if(!window.XLSX)return toast('Modul Excel tidak termuat');const list=periodEntries(days);if(!list.length)return toast('Tidak ada catatan di periode ini');
 const wb=XLSX.utils.book_new(),add=(name,head,rows,w)=>{const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
 add('Riwayat',['Tanggal','Mulai','Selesai','Kegiatan','Detail','Durasi (menit)'],list.map(entryRow),[14,8,8,14,40,14]);
 add('Ringkasan harian',['Tanggal','Menyusu (kali)','Menyusu (menit)','Botol (ml)','Tidur (jam)','Pipis','Pup','Tummy time (menit)','Vitamin/obat (kali)'],dailyRows(list),[14,14,15,11,11,7,7,18,18]);
 add('Pertumbuhan',['Tanggal','Berat (kg)','Panjang (cm)','Lingkar kepala (cm)'],S.entries.filter(e=>e.type==='growth').sort((a,b)=>a.t-b.t).map(e=>[tgl(e.t),e.w||'',e.l||'',e.hc||'']),[14,11,13,19]);
 add('Imunisasi',['Jadwal','Target','Vaksin','Status'],vaxRows().flatMap(r=>r.items.map(i=>[r.label,tgl(r.due),i.n,i.done?'Diberikan '+tgl(i.done):'Belum'])),[16,14,30,22]);
 add('Rekap harian BBLR',['Tanggal','Berat (g)','Minum ASIP/susu (ml)','Cara','Suhu (°C)','Napas maks (x/mnt)','BAB','Kencing','Muntah','PMK','Perah ASI (ml)','Masalah'],dailyRekap(days||365).reverse().map(r=>[tgl(r.t),r.bb,r.ml,r.cara,r.suhu,r.napas,r.bab,r.kencing,r.muntah,r.pmk,r.perah,r.masalah]),[14,10,18,24,10,16,6,8,8,9,14,30]);
 add('Kunjungan',['Tanggal','Tempat/dokter','Keluhan','Tindakan/saran','Tanggal kembali'],S.entries.filter(e=>e.type==='visit').sort((a,b)=>a.t-b.t).map(e=>[tgl(e.t),e.place||'',e.keluhan||'',e.saran||'',e.back?tgl(dk2ts(e.back)):'']),[14,22,30,40,16]);
 add('Penapisan',['Pemeriksaan','Tanggal','Hasil','Catatan'],PREM.filter(it=>(S.prem||{})[it.k]).map(it=>{const d=S.prem[it.k];return[it.t,tgl(d.t),resTxt(d),d.note||'']}),[34,14,30,30]);
 add('Vitamin',['Tanggal','Jam','Nama','Jumlah (ml)'],list.filter(e=>e.type==='med').map(e=>[tgl(e.t),hm(e.t),e.name,e.ml??'']),[14,8,22,12]);

/* foto: IndexedDB supaya tidak memenuhi penyimpanan utama */
let dbp=null;
function idb(op,key,val){if(!window.indexedDB)return Promise.reject();dbp=dbp||new Promise((res,rej)=>{const r=indexedDB.open('bayiku',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 return dbp.then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos',op==='get'||op==='all'?'readonly':'readwrite'),st=tx.objectStore('photos');let rq;
  if(op==='get')rq=st.get(key);else if(op==='put')rq=st.put(val,key);else if(op==='delete')rq=st.delete(key);else if(op==='all'){const out={};const c=st.openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error);return}
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)}))}
function loadPhotos(){document.querySelectorAll('[data-photo]').forEach(n=>{const id=n.dataset.photo;if(!id||n.dataset.done)return;n.dataset.done=1;idb('get',id).then(u=>{if(u)n.innerHTML='<img alt="" src="'+u+'">'}).catch(()=>{})})}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82))};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

function reminders(){const out=[],now=Date.now(),st=S.settings,nm=S.profile.name;
 const lf=sorted().find(e=>e.type==='feed');
 if(st.feedOn&&!S.timers.feed&&lf){const t=lf.t+st.feedHours*36e5;if(t>now)out.push({id:'feed',at:t,title:'Waktunya menyusu',body:dec(st.feedHours)+' jam sejak '+nm+' terakhir menyusu ('+sideName(lf.side==='L'?'R':'L')+' berikutnya)'})}
 if(st.vaxOn)for(const r of vaxRows()){if(r.allDone)continue;const items=r.items.filter(i=>!i.done).map(i=>i.n).join(', ');
  const pre=at8(r.due-st.vaxDays*864e5),day=at8(r.due);
  if(pre>now)out.push({id:'vaxpre'+r.m,at:pre,title:'Imunisasi '+st.vaxDays+' hari lagi',body:nm+': '+items+' ('+tgl(r.due)+')'});
  if(day>now)out.push({id:'vaxday'+r.m,at:day,title:'Hari ini jadwal imunisasi',body:nm+': '+items})}
 {const lp=sorted().find(e=>e.type==='pump');if(st.pumpOn&&lp){const t=lp.t+st.pumpHours*36e5;if(t>now)out.push({id:'pump',at:t,title:'Waktunya perah ASI',body:dec(st.pumpHours)+' jam sejak perah terakhir'})}
  const ls=sorted().find(e=>e.type==='skin');if(st.skinOn&&ls){const t=ls.t+8*36e5;if(t>now)out.push({id:'skin',at:t,title:'Waktunya pelembap kulit',body:nm+': oleskan pelembap (tiap 8 jam)'})}}
 for(const e of S.entries){if(e.type!=='visit'||!e.back)continue;const d=dk2ts(e.back),pre=d-864e5+19*36e5,day=d+7*36e5;if(pre>now)out.push({id:'visitpre'+e.id,at:pre,title:'Besok jadwal kontrol',body:nm+(e.place?' · '+e.place:'')});if(day>now)out.push({id:'visitday'+e.id,at:day,title:'Hari ini jadwal kontrol',body:nm+(e.place?' · '+e.place:'')})}
 for(const m of S.meds){if(!m.on)continue;for(let d=0;d<14;d++)for(const t of m.times){const[h,mi]=t.split(':').map(Number),x=new Date(startOfDay(now)+d*864e5);x.setHours(h,mi,0,0);if(x.getTime()>now&&!S.entries.some(e=>e.type==='med'&&e.medId===m.id&&e.slot===t&&dayKey(e.t)===dayKey(x.getTime())))out.push({id:'med'+m.id+dayKey(x.getTime())+t,at:x.getTime(),title:'Waktunya '+m.name,body:nm+(mlTxt(m)?' · '+mlTxt(m):'')+' (jam '+t+')'})}}
 return out.sort((a,b)=>a.at-b.at).slice(0,300)}
